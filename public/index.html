<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Value Bets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e1e4ed; min-height: 100vh;
    }
    .wrap { max-width: 800px; margin: 0 auto; padding: 20px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { font-size: 22px; }
    header h1 span { color: #00b894; }
    .keys-toggle {
      background: #1a1d28; border: 1px solid #2e3345; color: #8b90a0;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .keys-toggle:hover { border-color: #6c5ce7; color: #e1e4ed; }

    /* Key Management Panel */
    #keys-panel {
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 12px;
      padding: 20px; margin-bottom: 24px; display: none;
    }
    #keys-panel.open { display: block; }
    #keys-panel h2 { font-size: 16px; margin-bottom: 12px; }
    .key-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .key-form input {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #2e3345;
      background: #0f1117; color: #e1e4ed; font-size: 14px; outline: none;
    }
    .key-form input:focus { border-color: #6c5ce7; }
    .key-form input[name="key"] { flex: 1; min-width: 200px; font-family: monospace; }
    .key-form input[name="label"] { width: 120px; }
    .key-form button {
      padding: 10px 18px; border-radius: 8px; border: none;
      background: #00b894; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .key-form button:disabled { opacity: 0.5; }
    #key-error { color: #e17055; font-size: 13px; margin-bottom: 12px; }
    #key-success { color: #00b894; font-size: 13px; margin-bottom: 12px; }
    .key-list { list-style: none; }
    .key-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #0f1117; border: 1px solid #2e3345;
      border-radius: 8px; margin-bottom: 8px; font-size: 14px;
    }
    .key-item .label { font-weight: 600; margin-right: 12px; }
    .key-item .masked { color: #8b90a0; font-family: monospace; font-size: 13px; }
    .key-item .delete-btn {
      background: none; border: 1px solid #e17055; color: #e17055;
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    .key-item .delete-btn:hover { background: #e1705533; }
    .no-keys { color: #8b90a0; font-size: 14px; text-align: center; padding: 12px; }

    /* Date */
    .date { text-align: center; color: #8b90a0; font-size: 14px; margin-bottom: 20px; }
    .date strong { color: #e1e4ed; }

    /* Loading */
    .loading { text-align: center; padding: 60px 0; color: #8b90a0; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #2e3345; border-top-color: #00b894;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error / empty */
    .error-box {
      background: #e1705522; border: 1px solid #e17055; border-radius: 10px;
      padding: 20px; text-align: center; margin: 20px 0;
    }
    .empty { text-align: center; padding: 60px 0; color: #8b90a0; }

    /* Value bet rows */
    .bet-list { display: flex; flex-direction: column; gap: 10px; }
    .bet-row {
      display: flex; align-items: center; gap: 16px;
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 10px;
      padding: 14px 18px; transition: border-color 0.2s; cursor: pointer;
    }
    .bet-row:hover { border-color: #6c5ce7; }
    .bet-rank {
      font-size: 13px; font-weight: 700; color: #8b90a0; min-width: 28px; text-align: center;
    }
    .bet-value {
      font-size: 18px; font-weight: 700; min-width: 75px; text-align: right;
    }
    .val-high { color: #00b894; }
    .val-med { color: #fdcb6e; }
    .val-low { color: #e17055; }
    .bet-info { flex: 1; min-width: 0; }
    .bet-teams { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bet-teams .vs { color: #8b90a0; font-weight: 400; }
    .bet-meta { font-size: 12px; color: #8b90a0; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
    .bet-pick {
      background: #242836; border: 1px solid #2e3345; border-radius: 8px;
      padding: 8px 14px; text-align: center; min-width: 120px;
    }
    .bet-pick .outcome { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .bet-pick .odds { font-size: 16px; font-weight: 700; color: #00b894; }
    .bet-pick .bk { font-size: 11px; color: #8b90a0; }

    /* Expanded details */
    .bet-details {
      display: none; background: #1a1d28; border: 1px solid #2e3345;
      border-top: none; border-radius: 0 0 10px 10px; padding: 14px 18px;
      margin-top: -10px; margin-bottom: 10px;
    }
    .bet-details.open { display: block; }
    .outcomes-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .outcome-chip {
      background: #0f1117; border: 1px solid #2e3345; border-radius: 8px;
      padding: 10px 14px; flex: 1; min-width: 140px;
    }
    .outcome-chip .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .outcome-chip .stat { font-size: 12px; color: #8b90a0; display: flex; justify-content: space-between; }
    .outcome-chip .stat .v { color: #e1e4ed; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Soccer <span>Value Bets</span></h1>
    <button class="keys-toggle" onclick="toggleKeysPanel()">API Keys</button>
  </header>

  <div id="keys-panel">
    <h2>Manage API Keys</h2>
    <p style="font-size:13px;color:#8b90a0;margin-bottom:12px">
      Add one or more keys from <a href="https://the-odds-api.com" target="_blank" style="color:#00b894">the-odds-api.com</a>.
      If one expires, the next will be used automatically.
    </p>
    <div class="key-form">
      <input name="key" placeholder="Paste API key..." />
      <input name="label" placeholder="Label (optional)" />
      <button onclick="addKey()">Add Key</button>
    </div>
    <div id="key-error"></div>
    <div id="key-success"></div>
    <ul class="key-list" id="key-list"></ul>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div><p>Loading value bets...</p></div>
  </div>
</div>

<script>
  // --- Keys Panel ---
  function toggleKeysPanel() {
    document.getElementById('keys-panel').classList.toggle('open');
  }

  async function loadKeyList() {
    try {
      const res = await fetch('/api/keys');
      const keys = await res.json();
      const list = document.getElementById('key-list');
      if (keys.length === 0) {
        list.innerHTML = '<li class="no-keys">No API keys configured yet</li>';
        return;
      }
      list.innerHTML = keys.map(k => `
        <li class="key-item">
          <div>
            <span class="label">${esc(k.label)}</span>
            <span class="masked">${esc(k.masked)}</span>
          </div>
          <button class="delete-btn" onclick="deleteKey(${k.index})">Remove</button>
        </li>
      `).join('');
    } catch (e) {
      document.getElementById('key-list').innerHTML = '<li class="no-keys">Failed to load keys</li>';
    }
  }

  async function addKey() {
    const keyInput = document.querySelector('.key-form input[name="key"]');
    const labelInput = document.querySelector('.key-form input[name="label"]');
    const btn = document.querySelector('.key-form button');
    const errEl = document.getElementById('key-error');
    const okEl = document.getElementById('key-success');

    const key = keyInput.value.trim();
    if (!key) { errEl.textContent = 'Please enter an API key.'; return; }

    errEl.textContent = '';
    okEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Validating...';

    try {
      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, label: labelInput.value.trim() }),
      });
      const data = await res.json();
      if (data.error) {
        errEl.textContent = data.error;
      } else {
        okEl.textContent = data.warning
          ? 'Key saved! ⚠️ ' + data.warning
          : 'Key added successfully!';
        keyInput.value = '';
        labelInput.value = '';
        loadKeyList();
        loadData();
      }
    } catch (e) {
      errEl.textContent = 'Network error: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Key';
    }
  }

  async function deleteKey(index) {
    if (!confirm('Remove this API key?')) return;
    try {
      await fetch(`/api/keys/${index}`, { method: 'DELETE' });
      loadKeyList();
    } catch (e) {}
  }

  // --- Value Bets ---
  async function loadData() {
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading value bets...</p></div>';

    try {
      const res = await fetch('/api/value-bets');
      const data = await res.json();

      if (data.error === 'NO_KEYS' || data.error === 'ALL_KEYS_FAILED') {
        document.getElementById('keys-panel').classList.add('open');
        content.innerHTML = `<div class="error-box">
          <p><strong>No valid API key.</strong> Add your key above to get started.</p>
          <p style="margin-top:8px;font-size:13px;color:#8b90a0">
            Get a free key at <a href="https://the-odds-api.com" target="_blank" style="color:#00b894">the-odds-api.com</a>
          </p>
        </div>`;
        return;
      }

      if (data.error) {
        content.innerHTML = `<div class="error-box"><p>${esc(data.error)}</p></div>`;
        return;
      }

      if (data.totalMatches === 0) {
        content.innerHTML = `<div class="empty">
          <p style="font-size:18px;margin-bottom:8px">No value bets found for today</p>
          <p>There may be no soccer matches with positive value right now, or odds haven't been posted yet.</p>
        </div>`;
        return;
      }

      let html = `<div class="date">Today &mdash; <strong>${esc(data.date)}</strong> &mdash; ${data.totalMatches} value bet${data.totalMatches !== 1 ? 's' : ''} found</div>`;
      html += '<div class="bet-list">';

      data.valueBets.forEach((m, i) => {
        const v = m.bestBet.valuePercent;
        const cls = v >= 5 ? 'val-high' : v >= 2 ? 'val-med' : 'val-low';
        const kickoff = new Date(m.kickoff).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        html += `
          <div class="bet-row" onclick="toggle(${i})">
            <div class="bet-rank">#${i + 1}</div>
            <div class="bet-value ${cls}">+${v.toFixed(1)}%</div>
            <div class="bet-info">
              <div class="bet-teams">${esc(m.homeTeam)} <span class="vs">vs</span> ${esc(m.awayTeam)}</div>
              <div class="bet-meta">
                <span>${esc(m.league)}</span>
                <span>${kickoff}</span>
                <span>${m.bestBet.numBookmakers} bookmakers</span>
              </div>
            </div>
            <div class="bet-pick">
              <div class="outcome">${esc(m.bestBet.outcome)}</div>
              <div class="odds">${m.bestBet.bestOdds.toFixed(2)}</div>
              <div class="bk">${esc(m.bestBet.bestBookmaker)}</div>
            </div>
          </div>
          <div class="bet-details" id="details-${i}">
            <div style="font-size:12px;color:#8b90a0;margin-bottom:8px">All outcomes for this match:</div>
            <div class="outcomes-row">
              ${m.allOutcomes.map(o => {
                const ov = o.valuePercent;
                const oc = ov > 0 ? '#00b894' : '#e17055';
                return `<div class="outcome-chip">
                  <div class="name">${esc(o.outcome)}</div>
                  <div class="stat"><span>Fair prob</span> <span class="v">${(o.fairProbability * 100).toFixed(1)}%</span></div>
                  <div class="stat"><span>Best odds</span> <span class="v">${o.bestOdds.toFixed(2)} (${esc(o.bestBookmaker)})</span></div>
                  <div class="stat"><span>Avg odds</span> <span class="v">${o.avgOdds.toFixed(2)}</span></div>
                  <div class="stat"><span>Value</span> <span class="v" style="color:${oc}">${ov > 0 ? '+' : ''}${ov.toFixed(1)}%</span></div>
                </div>`;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += '</div>';
      content.innerHTML = html;
    } catch (err) {
      content.innerHTML = `<div class="error-box"><p>Failed to load: ${esc(err.message)}</p></div>`;
    }
  }

  function toggle(i) {
    document.getElementById('details-' + i).classList.toggle('open');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Allow Enter in key input
  document.querySelector('.key-form input[name="key"]').addEventListener('keydown', e => {
    if (e.key === 'Enter') addKey();
  });

  // Init
  loadKeyList();
  loadData();
</script>
</body>
</html>
