<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Finder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e1e4ed; min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 20px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header h1 span { color: #00b894; }
    .settings-toggle {
      background: #1a1d28; border: 1px solid #2e3345; color: #8b90a0;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .settings-toggle:hover { border-color: #6c5ce7; color: #e1e4ed; }

    /* Panels */
    .panel {
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 12px;
      padding: 20px; margin-bottom: 16px; display: none;
    }
    .panel.open { display: block; }
    .panel h2 { font-size: 16px; margin-bottom: 14px; color: #e1e4ed; }
    .panel p.hint { font-size: 13px; color: #8b90a0; margin-bottom: 14px; }
    .panel p.hint a { color: #00b894; text-decoration: none; }

    /* Forms */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #8b90a0; margin-bottom: 6px; font-weight: 600; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] {
      padding: 10px 14px; border-radius: 8px; border: 1px solid #2e3345;
      background: #0f1117; color: #e1e4ed; font-size: 14px; outline: none; flex: 1;
    }
    input:focus { border-color: #6c5ce7; }
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600;
      font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .btn-primary { background: #00b894; color: #fff; }
    .btn-primary:hover { background: #00a381; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #2e3345; color: #e1e4ed; }
    .btn-secondary:hover { background: #3d4259; }
    .msg-ok { color: #00b894; font-size: 13px; margin-top: 8px; }
    .msg-err { color: #e17055; font-size: 13px; margin-top: 8px; }

    /* Team bar */
    #team-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 10px;
      padding: 12px 18px; margin-bottom: 16px;
    }
    .team-info { font-size: 14px; color: #8b90a0; }
    .team-info strong { color: #e1e4ed; }
    .team-info .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-ok { background: #00b894; }
    .dot-warn { background: #fdcb6e; }
    .dot-none { background: #636e72; }

    /* Search */
    #search-section { margin-bottom: 20px; }
    .search-bar { display: flex; gap: 8px; }
    .search-bar input {
      flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid #2e3345;
      background: #1a1d28; color: #e1e4ed; font-size: 15px; outline: none;
    }
    .search-bar input:focus { border-color: #6c5ce7; }
    .search-bar input::placeholder { color: #636e72; }
    .search-bar button { padding: 14px 28px; border-radius: 10px; font-size: 15px; }
    .search-hint { font-size: 12px; color: #636e72; margin-top: 8px; padding-left: 4px; }

    /* Loading */
    .loading { text-align: center; padding: 50px 0; color: #8b90a0; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #2e3345; border-top-color: #00b894;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Target info */
    .target-card {
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 12px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .target-header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .target-logo {
      width: 44px; height: 44px; border-radius: 8px; background: #2e3345;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      font-weight: 700; color: #00b894; overflow: hidden;
    }
    .target-logo img { width: 100%; height: 100%; object-fit: cover; }
    .target-name { font-size: 18px; font-weight: 700; }
    .target-domain { font-size: 13px; color: #8b90a0; }
    .target-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #8b90a0; }
    .target-meta span { display: flex; align-items: center; gap: 4px; }
    .target-person {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #2e3345;
      font-size: 13px; color: #8b90a0;
    }
    .target-person strong { color: #e1e4ed; }

    /* Results */
    .results-header { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .results-header span { color: #00b894; }
    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: #8b90a0; margin: 20px 0 10px; padding-left: 4px;
    }

    .connection-card {
      display: flex; gap: 14px; align-items: flex-start;
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 10px;
      padding: 16px 18px; margin-bottom: 8px; transition: border-color 0.2s;
    }
    .connection-card:hover { border-color: #6c5ce7; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #2e3345;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #6c5ce7; flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .conn-info { flex: 1; min-width: 0; }
    .conn-name { font-size: 15px; font-weight: 600; }
    .conn-name a { color: #e1e4ed; text-decoration: none; }
    .conn-name a:hover { color: #6c5ce7; }
    .conn-title { font-size: 13px; color: #8b90a0; margin-top: 1px; }
    .conn-location { font-size: 12px; color: #636e72; margin-top: 2px; }
    .conn-match {
      margin-top: 8px; padding: 8px 12px; background: #0f1117;
      border: 1px solid #2e3345; border-radius: 8px; font-size: 13px;
    }
    .conn-match .label { color: #00b894; font-weight: 600; font-size: 12px; margin-bottom: 3px; }
    .conn-match .detail { color: #e1e4ed; }
    .conn-match .dates { color: #8b90a0; font-size: 12px; margin-top: 2px; }
    .conn-links { display: flex; gap: 8px; margin-top: 8px; }
    .conn-links a {
      font-size: 12px; color: #6c5ce7; text-decoration: none; padding: 3px 8px;
      border: 1px solid #6c5ce733; border-radius: 6px;
    }
    .conn-links a:hover { background: #6c5ce722; border-color: #6c5ce7; }

    /* Empty / error */
    .empty-state {
      text-align: center; padding: 50px 20px; color: #8b90a0;
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state p { margin-bottom: 6px; }
    .empty-state .note { font-size: 13px; color: #636e72; }
    .error-box {
      background: #e1705515; border: 1px solid #e1705544; border-radius: 10px;
      padding: 16px 20px; text-align: center; color: #e17055; font-size: 14px;
    }

    /* Progress bar */
    .progress-bar {
      height: 4px; background: #2e3345; border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #00b894; border-radius: 2px; transition: width 0.3s;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Connection<span>Finder</span></h1>
    <button class="settings-toggle" onclick="toggleSettings()">Settings</button>
  </header>

  <!-- Settings Panel -->
  <div class="panel" id="settings-panel">
    <h2>Configuration</h2>
    <p class="hint" id="settings-hint">
      Enter your <a href="https://app.apollo.io/#/settings/integrations/api" target="_blank">Apollo.io API key</a>
      and your company's domain to get started.
    </p>
    <div class="form-group" id="apikey-group">
      <label>Apollo API Key</label>
      <div class="input-row">
        <input type="password" id="inp-apikey" placeholder="Enter your Apollo.io API key..." />
      </div>
    </div>
    <div class="form-group" id="domain-group">
      <label>Your Company Domain</label>
      <div class="input-row">
        <input type="text" id="inp-domain" placeholder="e.g. yourcompany.com" />
      </div>
    </div>
    <button class="btn btn-primary" id="save-settings-btn" onclick="saveSettings()">Save Settings</button>
    <div id="settings-msg"></div>
  </div>

  <!-- Team Sync Bar -->
  <div id="team-bar">
    <div class="team-info" id="team-info">Loading...</div>
    <button class="btn btn-secondary" id="sync-btn" onclick="syncTeam()">Sync Team</button>
  </div>

  <!-- Search -->
  <div id="search-section">
    <div class="search-bar">
      <input type="text" id="search-input"
        placeholder="Enter a company domain, person's email, or LinkedIn URL..."
        onkeydown="if(event.key==='Enter')doSearch()" />
      <button class="btn btn-primary" id="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div class="search-hint">Accepts company domains (microsoft.com), emails (jane@company.com), or LinkedIn profile URLs</div>
  </div>

  <!-- Results -->
  <div id="results"></div>
</div>

<script>
  // ========== API HELPER ==========
  async function api(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json();
    if (!res.ok && data.error) throw new Error(data.error);
    return data;
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ========== SETTINGS ==========
  let settingsLoaded = false;

  function toggleSettings() {
    document.getElementById('settings-panel').classList.toggle('open');
  }

  async function loadSettings() {
    try {
      const s = await api('/api/settings');

      // Handle env-var configured state
      const keyGroup = document.getElementById('apikey-group');
      const domainGroup = document.getElementById('domain-group');
      const hint = document.getElementById('settings-hint');
      const saveBtn = document.getElementById('save-settings-btn');
      let allFromEnv = true;

      if (s.apiKeyFromEnv) {
        keyGroup.innerHTML = `<label>Apollo API Key</label><div style="font-size:13px;color:#00b894;padding:4px 0">Configured by admin (env var)</div>`;
      } else if (s.maskedKey) {
        document.getElementById('inp-apikey').placeholder = `Current: ${s.maskedKey}`;
        allFromEnv = false;
      } else {
        allFromEnv = false;
      }

      if (s.domainFromEnv) {
        domainGroup.innerHTML = `<label>Your Company Domain</label><div style="font-size:13px;color:#00b894;padding:4px 0">${esc(s.companyDomain)}</div>`;
      } else {
        if (s.companyDomain) document.getElementById('inp-domain').value = s.companyDomain;
        allFromEnv = false;
      }

      if (allFromEnv && s.hasApiKey && s.companyDomain) {
        hint.textContent = 'Configuration is managed via environment variables.';
        saveBtn.style.display = 'none';
      }

      if (!s.hasApiKey) {
        document.getElementById('settings-panel').classList.add('open');
      }

      settingsLoaded = true;
      return s;
    } catch (e) {
      document.getElementById('settings-panel').classList.add('open');
      return {};
    }
  }

  async function saveSettings() {
    const msg = document.getElementById('settings-msg');
    const apiKey = document.getElementById('inp-apikey').value.trim();
    const domain = document.getElementById('inp-domain').value.trim();

    if (!apiKey && !document.getElementById('inp-apikey').placeholder.includes('Current')) {
      msg.className = 'msg-err';
      msg.textContent = 'Please enter your Apollo API key.';
      return;
    }
    if (!domain) {
      msg.className = 'msg-err';
      msg.textContent = 'Please enter your company domain.';
      return;
    }

    try {
      const body = { companyDomain: domain };
      if (apiKey) body.apiKey = apiKey;
      await api('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      msg.className = 'msg-ok';
      msg.textContent = 'Settings saved!';
      if (apiKey) {
        document.getElementById('inp-apikey').value = '';
        document.getElementById('inp-apikey').placeholder = `Current: ${apiKey.slice(0, 8)}...${apiKey.slice(-4)}`;
      }
      loadTeamStatus();
      setTimeout(() => { msg.textContent = ''; }, 3000);
    } catch (e) {
      msg.className = 'msg-err';
      msg.textContent = e.message;
    }
  }

  // ========== TEAM SYNC ==========
  let pollTimer = null;

  async function loadTeamStatus() {
    try {
      const st = await api('/api/team/status');
      renderTeamBar(st);
      if (st.syncing && !pollTimer) {
        pollTimer = setInterval(pollSync, 1500);
      }
    } catch (e) {
      document.getElementById('team-info').textContent = 'Could not load team status';
    }
  }

  function renderTeamBar(st) {
    const info = document.getElementById('team-info');
    const btn = document.getElementById('sync-btn');

    if (st.syncing) {
      const pct = st.total > 0 ? Math.round((st.fetched / st.total) * 100) : 0;
      info.innerHTML = `<span class="dot dot-warn"></span>Syncing... <strong>${st.fetched}</strong> of ${st.total} fetched (${pct}%)`;
      btn.disabled = true;
      btn.textContent = 'Syncing...';
    } else if (st.teamSize > 0) {
      const ago = st.lastSync ? timeAgo(new Date(st.lastSync)) : 'unknown';
      info.innerHTML = `<span class="dot dot-ok"></span><strong>${st.teamSize}</strong> team members synced &middot; last synced ${esc(ago)}`;
      btn.disabled = false;
      btn.textContent = 'Re-sync';
    } else {
      info.innerHTML = '<span class="dot dot-none"></span>Team not synced yet';
      btn.disabled = false;
      btn.textContent = 'Sync Team';
    }

    if (st.error) {
      info.innerHTML += ` <span style="color:#e17055;margin-left:8px">${esc(st.error)}</span>`;
    }
  }

  async function syncTeam() {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.textContent = 'Starting...';

    try {
      await api('/api/team/sync', { method: 'POST' });
      if (!pollTimer) pollTimer = setInterval(pollSync, 1500);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Sync Team';
      const info = document.getElementById('team-info');
      info.innerHTML = `<span class="dot dot-none"></span><span style="color:#e17055">${esc(e.message)}</span>`;
    }
  }

  async function pollSync() {
    try {
      const st = await api('/api/team/status');
      renderTeamBar(st);
      if (!st.syncing) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    } catch (e) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function timeAgo(date) {
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (secs < 60) return 'just now';
    if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
    return `${Math.floor(secs / 86400)}d ago`;
  }

  // ========== SEARCH ==========
  async function doSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;

    const results = document.getElementById('results');
    const btn = document.getElementById('search-btn');

    results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching for connections...</p></div>';
    btn.disabled = true;

    try {
      const data = await api('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      renderResults(data);
    } catch (e) {
      results.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    const el = document.getElementById('results');
    let html = '';

    if (data.message && !data.target) {
      el.innerHTML = `<div class="empty-state"><div class="icon">?</div><p>${esc(data.message)}</p></div>`;
      return;
    }

    // Target card
    if (data.target) {
      const t = data.target;
      const org = t.org || {};
      const initial = (t.name || t.domain || '?')[0].toUpperCase();

      html += '<div class="target-card">';
      html += '<div class="target-header">';
      if (org.logoUrl) {
        html += `<div class="target-logo"><img src="${esc(org.logoUrl)}" alt="" onerror="this.parentElement.textContent='${initial}'"></div>`;
      } else {
        html += `<div class="target-logo">${initial}</div>`;
      }
      html += '<div>';
      html += `<div class="target-name">${esc(t.name || t.domain)}</div>`;
      if (t.domain) html += `<div class="target-domain">${esc(t.domain)}</div>`;
      html += '</div></div>';

      // Meta info
      const meta = [];
      if (org.industry) meta.push(org.industry);
      if (org.employeeCount) meta.push(`${org.employeeCount.toLocaleString()} employees`);
      const loc = [org.city, org.state, org.country].filter(Boolean).join(', ');
      if (loc) meta.push(loc);
      if (meta.length) {
        html += '<div class="target-meta">' + meta.map(m => `<span>${esc(m)}</span>`).join('') + '</div>';
      }

      // Target person (if searched by email/linkedin)
      if (t.person) {
        html += `<div class="target-person">Looked up: <strong>${esc(t.person.name)}</strong>`;
        if (t.person.title) html += ` &mdash; ${esc(t.person.title)}`;
        html += '</div>';
      }

      html += '</div>';
    }

    const totalConns = (data.connections || []).length + (data.reverseConnections || []).length;

    if (totalConns === 0) {
      html += '<div class="empty-state">';
      html += '<div class="icon">--</div>';
      html += '<p>No connections found</p>';
      if (!data.hasEmploymentData) {
        html += '<p class="note">Your team sync may not have returned employment history data. Apollo\'s People Search sometimes omits past employment. Try re-syncing or checking individual profiles.</p>';
      } else {
        html += '<p class="note">None of your team members have known prior employment at this company.</p>';
      }
      html += '</div>';
      el.innerHTML = html;
      return;
    }

    // Results header
    html += `<div class="results-header"><span>${totalConns}</span> connection${totalConns !== 1 ? 's' : ''} found</div>`;

    // Our team → target company
    if (data.connections && data.connections.length) {
      html += `<div class="section-label">Your team members who previously worked there</div>`;
      for (const c of data.connections) {
        html += renderConnectionCard(c, 'formerly_at_target');
      }
    }

    // Reverse: target company → our team
    if (data.reverseConnections && data.reverseConnections.length) {
      html += `<div class="section-label">People there who previously worked at your company</div>`;
      for (const c of data.reverseConnections) {
        html += renderConnectionCard(c, 'formerly_at_ours');
      }
    }

    el.innerHTML = html;
  }

  function renderConnectionCard(c, type) {
    const p = c.person;
    const initials = getInitials(p.name);
    let html = '<div class="connection-card">';

    // Avatar
    if (p.photoUrl) {
      html += `<div class="avatar"><img src="${esc(p.photoUrl)}" alt="" onerror="this.parentElement.textContent='${esc(initials)}'"></div>`;
    } else {
      html += `<div class="avatar">${esc(initials)}</div>`;
    }

    html += '<div class="conn-info">';

    // Name
    if (p.linkedinUrl) {
      html += `<div class="conn-name"><a href="${esc(p.linkedinUrl)}" target="_blank">${esc(p.name)}</a></div>`;
    } else {
      html += `<div class="conn-name">${esc(p.name)}</div>`;
    }

    // Current title
    if (p.title) html += `<div class="conn-title">${esc(p.title)}</div>`;
    if (p.location) html += `<div class="conn-location">${esc(p.location)}</div>`;

    // Match details
    for (const m of (c.matches || [])) {
      html += '<div class="conn-match">';
      if (type === 'formerly_at_target') {
        html += '<div class="label">Previously worked at target company</div>';
      } else {
        html += '<div class="label">Previously worked at your company</div>';
      }
      const parts = [];
      if (m.role) parts.push(m.role);
      if (m.company) parts.push(`at ${m.company}`);
      if (parts.length) html += `<div class="detail">${esc(parts.join(' '))}</div>`;

      const dates = formatDateRange(m.startDate, m.endDate);
      if (dates) html += `<div class="dates">${esc(dates)}</div>`;
      html += '</div>';
    }

    // Links
    const links = [];
    if (p.linkedinUrl) links.push(`<a href="${esc(p.linkedinUrl)}" target="_blank">LinkedIn</a>`);
    if (p.email) links.push(`<a href="mailto:${esc(p.email)}">Email</a>`);
    if (links.length) html += `<div class="conn-links">${links.join('')}</div>`;

    html += '</div></div>';
    return html;
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }

  function formatDateRange(start, end) {
    if (!start && !end) return '';
    const fmt = d => {
      if (!d) return 'Present';
      const parts = d.split('-');
      if (parts.length >= 2) {
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const m = parseInt(parts[1], 10);
        return `${months[m - 1] || ''} ${parts[0]}`.trim();
      }
      return d;
    };
    return `${fmt(start)} - ${fmt(end)}`;
  }

  // ========== INIT ==========
  (async function init() {
    const settings = await loadSettings();
    await loadTeamStatus();
  })();
</script>
</body>
</html>
