<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Lookup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e1e4ed; min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header h1 span { color: #00b894; }
    .settings-toggle {
      background: #1a1d28; border: 1px solid #2e3345; color: #8b90a0;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .settings-toggle:hover { border-color: #6c5ce7; color: #e1e4ed; }

    .panel {
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 12px;
      padding: 20px; margin-bottom: 16px; display: none;
    }
    .panel.open { display: block; }
    .panel h2 { font-size: 16px; margin-bottom: 14px; }
    .panel p.hint { font-size: 13px; color: #8b90a0; margin-bottom: 14px; }
    .panel p.hint a { color: #00b894; text-decoration: none; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #8b90a0; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #2e3345;
      background: #0f1117; color: #e1e4ed; font-size: 14px; outline: none;
    }
    input:focus { border-color: #6c5ce7; }
    .btn {
      padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600;
      font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .btn-primary { background: #00b894; color: #fff; }
    .btn-primary:hover { background: #00a381; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg-ok { color: #00b894; font-size: 13px; margin-top: 8px; }
    .msg-err { color: #e17055; font-size: 13px; margin-top: 8px; }

    /* Search */
    .search-bar { display: flex; gap: 8px; margin-bottom: 6px; }
    .search-bar input {
      flex: 1; padding: 14px 18px; border-radius: 10px; border: 1px solid #2e3345;
      background: #1a1d28; color: #e1e4ed; font-size: 15px; outline: none;
    }
    .search-bar input:focus { border-color: #6c5ce7; }
    .search-bar input::placeholder { color: #636e72; }
    .search-bar button { padding: 14px 28px; border-radius: 10px; font-size: 15px; }
    .search-hint { font-size: 12px; color: #636e72; margin-bottom: 20px; padding-left: 4px; }

    /* Loading */
    .loading { text-align: center; padding: 50px 0; color: #8b90a0; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #2e3345; border-top-color: #00b894;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Company card */
    .company-card {
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 12px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .company-header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .company-logo {
      width: 48px; height: 48px; border-radius: 10px; background: #2e3345;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      font-weight: 700; color: #00b894; overflow: hidden; flex-shrink: 0;
    }
    .company-logo img { width: 100%; height: 100%; object-fit: cover; }
    .company-name { font-size: 18px; font-weight: 700; }
    .company-domain { font-size: 13px; color: #8b90a0; }
    .company-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #8b90a0; }
    .company-desc { font-size: 13px; color: #8b90a0; margin-top: 10px; line-height: 1.5; }

    /* People list */
    .people-header {
      font-size: 15px; font-weight: 600; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .people-header span { color: #00b894; }
    .people-header .total { font-size: 13px; color: #8b90a0; font-weight: 400; }

    .person-row {
      display: flex; gap: 12px; align-items: center;
      background: #1a1d28; border: 1px solid #2e3345; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 6px; transition: border-color 0.2s;
    }
    .person-row:hover { border-color: #6c5ce7; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #2e3345;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #6c5ce7; flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .person-info { flex: 1; min-width: 0; }
    .person-name { font-size: 14px; font-weight: 600; }
    .person-name a { color: #e1e4ed; text-decoration: none; }
    .person-name a:hover { color: #6c5ce7; }
    .person-title { font-size: 13px; color: #8b90a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .person-location { font-size: 12px; color: #636e72; }
    .person-links { display: flex; gap: 6px; flex-shrink: 0; }
    .person-links a {
      font-size: 11px; color: #6c5ce7; text-decoration: none; padding: 3px 8px;
      border: 1px solid #6c5ce733; border-radius: 6px;
    }
    .person-links a:hover { background: #6c5ce722; border-color: #6c5ce7; }

    .empty-state { text-align: center; padding: 50px 20px; color: #8b90a0; }
    .empty-state p { margin-bottom: 6px; }
    .error-box {
      background: #e1705515; border: 1px solid #e1705544; border-radius: 10px;
      padding: 16px 20px; text-align: center; color: #e17055; font-size: 14px;
    }
    .warn-box {
      background: #fdcb6e15; border: 1px solid #fdcb6e44; border-radius: 10px;
      padding: 12px 16px; text-align: center; color: #fdcb6e; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Company<span>Lookup</span></h1>
    <button class="settings-toggle" onclick="toggleSettings()">Settings</button>
  </header>

  <!-- Settings Panel -->
  <div class="panel" id="settings-panel">
    <h2>Configuration</h2>
    <p class="hint" id="settings-hint">
      Enter your <a href="https://app.apollo.io/#/settings/integrations/api" target="_blank">Apollo.io API key</a> to get started.
    </p>
    <div class="form-group" id="apikey-group">
      <label>Apollo API Key</label>
      <input type="password" id="inp-apikey" placeholder="Enter your Apollo.io API key..." />
    </div>
    <button class="btn btn-primary" id="save-settings-btn" onclick="saveSettings()">Save</button>
    <div id="settings-msg"></div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="search-input"
      placeholder="Enter a company domain (e.g. stripe.com)"
      onkeydown="if(event.key==='Enter')doLookup()" />
    <button class="btn btn-primary" id="search-btn" onclick="doLookup()">Look up</button>
  </div>
  <div class="search-hint">Enter any company domain to see who works there</div>

  <!-- Results -->
  <div id="results"></div>
</div>

<script>
  async function api(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json();
    if (!res.ok && data.error) throw new Error(data.error);
    return data;
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
  }

  // ========== SETTINGS ==========
  function toggleSettings() {
    document.getElementById('settings-panel').classList.toggle('open');
  }

  async function loadSettings() {
    try {
      const s = await api('/api/settings');
      const keyGroup = document.getElementById('apikey-group');
      const hint = document.getElementById('settings-hint');
      const saveBtn = document.getElementById('save-settings-btn');

      if (s.apiKeyFromEnv) {
        keyGroup.innerHTML = `<label>Apollo API Key</label><div style="font-size:13px;color:#00b894;padding:4px 0">Configured by admin (env var)</div>`;
        hint.textContent = 'Configuration is managed via environment variables.';
        saveBtn.style.display = 'none';
      } else if (s.maskedKey) {
        document.getElementById('inp-apikey').placeholder = `Current: ${s.maskedKey}`;
      }

      if (!s.hasApiKey) {
        document.getElementById('settings-panel').classList.add('open');
      }
    } catch (e) {
      document.getElementById('settings-panel').classList.add('open');
    }
  }

  async function saveSettings() {
    const msg = document.getElementById('settings-msg');
    const apiKey = document.getElementById('inp-apikey').value.trim();

    if (!apiKey && !document.getElementById('inp-apikey').placeholder.includes('Current')) {
      msg.className = 'msg-err';
      msg.textContent = 'Please enter your Apollo API key.';
      return;
    }

    try {
      const body = {};
      if (apiKey) body.apiKey = apiKey;
      await api('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      msg.className = 'msg-ok';
      msg.textContent = 'Saved!';
      if (apiKey) {
        document.getElementById('inp-apikey').value = '';
        document.getElementById('inp-apikey').placeholder = `Current: ${apiKey.slice(0, 8)}...${apiKey.slice(-4)}`;
      }
      setTimeout(() => { msg.textContent = ''; }, 3000);
    } catch (e) {
      msg.className = 'msg-err';
      msg.textContent = e.message;
    }
  }

  // ========== LOOKUP ==========
  async function doLookup() {
    const domain = document.getElementById('search-input').value.trim();
    if (!domain) return;

    const results = document.getElementById('results');
    const btn = document.getElementById('search-btn');

    results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Looking up employees...</p></div>';
    btn.disabled = true;

    try {
      const data = await api('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domain }),
      });
      renderResults(data);
    } catch (e) {
      results.innerHTML = `<div class="error-box">${esc(e.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderResults(data) {
    const el = document.getElementById('results');
    let html = '';

    // Company card
    if (data.org) {
      const o = data.org;
      const initial = (o.name || o.domain || '?')[0].toUpperCase();
      html += '<div class="company-card">';
      html += '<div class="company-header">';
      if (o.logoUrl) {
        html += `<div class="company-logo"><img src="${esc(o.logoUrl)}" alt="" onerror="this.parentElement.textContent='${initial}'"></div>`;
      } else {
        html += `<div class="company-logo">${initial}</div>`;
      }
      html += '<div>';
      html += `<div class="company-name">${esc(o.name || o.domain)}</div>`;
      if (o.domain) html += `<div class="company-domain">${esc(o.domain)}</div>`;
      html += '</div></div>';

      const meta = [];
      if (o.industry) meta.push(o.industry);
      if (o.employeeCount) meta.push(`~${o.employeeCount.toLocaleString()} employees`);
      const loc = [o.city, o.state, o.country].filter(Boolean).join(', ');
      if (loc) meta.push(loc);
      if (meta.length) html += '<div class="company-meta">' + meta.map(m => `<span>${esc(m)}</span>`).join(' &middot; ') + '</div>';
      if (o.description) html += `<div class="company-desc">${esc(o.description)}</div>`;
      html += '</div>';
    }

    // Warning if search was blocked
    if (data.error) {
      html += `<div class="warn-box">${esc(data.error)}</div>`;
    }

    // People list
    if (data.people && data.people.length) {
      html += '<div class="people-header">';
      html += `<div><span>${data.people.length}</span> people found</div>`;
      if (data.total > data.people.length) html += `<div class="total">${data.total.toLocaleString()} total at this company</div>`;
      html += '</div>';

      for (const p of data.people) {
        const initials = getInitials(p.name);
        html += '<div class="person-row">';

        if (p.photoUrl) {
          html += `<div class="avatar"><img src="${esc(p.photoUrl)}" alt="" onerror="this.parentElement.textContent='${esc(initials)}'"></div>`;
        } else {
          html += `<div class="avatar">${esc(initials)}</div>`;
        }

        html += '<div class="person-info">';
        if (p.linkedinUrl) {
          html += `<div class="person-name"><a href="${esc(p.linkedinUrl)}" target="_blank">${esc(p.name)}</a></div>`;
        } else {
          html += `<div class="person-name">${esc(p.name)}</div>`;
        }
        if (p.title) html += `<div class="person-title">${esc(p.title)}</div>`;
        const loc = [p.city, p.state, p.country].filter(Boolean).join(', ');
        if (loc) html += `<div class="person-location">${esc(loc)}</div>`;
        html += '</div>';

        const links = [];
        if (p.linkedinUrl) links.push(`<a href="${esc(p.linkedinUrl)}" target="_blank">LinkedIn</a>`);
        if (p.email) links.push(`<a href="mailto:${esc(p.email)}">Email</a>`);
        if (links.length) html += `<div class="person-links">${links.join('')}</div>`;

        html += '</div>';
      }
    } else if (!data.error) {
      html += '<div class="empty-state"><p>No people found for this domain.</p></div>';
    }

    el.innerHTML = html;
  }

  // ========== INIT ==========
  loadSettings();
</script>
</body>
</html>
